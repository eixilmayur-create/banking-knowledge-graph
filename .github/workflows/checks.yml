name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install fastapi httpx pytest neo4j google-genai python-dotenv
      - run: python -m compileall -q src scripts tests
      - run: python -m pytest tests/test_offline_api.py -q
